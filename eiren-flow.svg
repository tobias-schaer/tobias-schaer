<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="How Eiren AI works: user state to LLM to ElevenLabs voice to a personal meditation"><title>How Eiren AI works: user state to LLM to ElevenLabs voice to a personal meditation</title><defs></defs><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.pu{animation:pu 6s ease-in-out infinite}@keyframes pu{0%,100%{stroke:#E7E5E4}6%,20%{stroke:#0C0A09}30%{stroke:#E7E5E4}}.fl{stroke-dasharray:5 5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-10}}.in{animation:up .9s both}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style><rect x=".5" y=".5" width="1199" height="439" rx="28" fill="#FDFCFC" stroke="#E7E5E4"/><text class="m" x="40" y="66" font-size="13" font-weight="400" fill="#777169" text-anchor="start" letter-spacing="3.5">HOW EIREN AI WORKS</text><g class="in" style="animation-delay:0s"><rect class="pu" x="40" y="100" width="250" height="112" rx="20" fill="#F5F3F1" stroke="#E7E5E4" stroke-width="1.5" style="animation-delay:0s"/><text class="m" x="64" y="134" font-size="12" font-weight="400" fill="#777169" text-anchor="start" letter-spacing="2.4">INPUT</text><text x="64" y="166" font-size="20" font-weight="400" fill="#0C0A09" text-anchor="start">User state</text><text x="64" y="190" font-size="14" font-weight="300" fill="#777169" text-anchor="start">mood · goals · journal</text></g><line class="fl" x1="296" y1="156" x2="324" y2="156" stroke="#0C0A09" stroke-width="2" stroke-linecap="round"/><g class="in" style="animation-delay:0.1s"><rect class="pu" x="330" y="100" width="250" height="112" rx="20" fill="#F5F3F1" stroke="#E7E5E4" stroke-width="1.5" style="animation-delay:1.4s"/><text class="m" x="354" y="134" font-size="12" font-weight="400" fill="#777169" text-anchor="start" letter-spacing="2.4">LLM</text><text x="354" y="166" font-size="20" font-weight="400" fill="#0C0A09" text-anchor="start">Writes the script</text><text x="354" y="190" font-size="14" font-weight="300" fill="#777169" text-anchor="start">per user, per session</text></g><line class="fl" x1="586" y1="156" x2="614" y2="156" stroke="#0C0A09" stroke-width="2" stroke-linecap="round"/><g class="in" style="animation-delay:0.2s"><rect class="pu" x="620" y="100" width="250" height="112" rx="20" fill="#F5F3F1" stroke="#E7E5E4" stroke-width="1.5" style="animation-delay:2.8s"/><text class="m" x="644" y="134" font-size="12" font-weight="400" fill="#777169" text-anchor="start" letter-spacing="2.4">ELEVENLABS</text><text x="644" y="166" font-size="20" font-weight="400" fill="#0C0A09" text-anchor="start">Voices it</text><text x="644" y="190" font-size="14" font-weight="300" fill="#777169" text-anchor="start">TTS, human-sounding</text></g><line class="fl" x1="876" y1="156" x2="904" y2="156" stroke="#0C0A09" stroke-width="2" stroke-linecap="round"/><g class="in" style="animation-delay:0.3s"><rect class="pu" x="910" y="100" width="250" height="112" rx="20" fill="#F5F3F1" stroke="#E7E5E4" stroke-width="1.5" style="animation-delay:4.2s"/><text class="m" x="934" y="134" font-size="12" font-weight="400" fill="#777169" text-anchor="start" letter-spacing="2.4">OUTPUT</text><text x="934" y="166" font-size="20" font-weight="400" fill="#0C0A09" text-anchor="start">Meditation, voiced</text><text x="934" y="190" font-size="14" font-weight="300" fill="#777169" text-anchor="start">unique for every user</text></g><g class="in" style="animation-delay:0.5s"><rect class="" x="40" y="262" width="360" height="112" rx="20" fill="#F5F3F1" stroke="#E7E5E4" stroke-width="1.5"/><text class="m" x="64" y="296" font-size="12" font-weight="400" fill="#777169" text-anchor="start" letter-spacing="2.4">AI COACH</text><text x="64" y="328" font-size="20" font-weight="400" fill="#0C0A09" text-anchor="start">Connects data across the app</text><text x="64" y="352" font-size="14" font-weight="300" fill="#777169" text-anchor="start">journal · mood · goals → suggestions</text></g><g class="in" style="animation-delay:0.62s"><rect class="" x="420" y="262" width="360" height="112" rx="20" fill="#F5F3F1" stroke="#E7E5E4" stroke-width="1.5"/><text class="m" x="444" y="296" font-size="12" font-weight="400" fill="#777169" text-anchor="start" letter-spacing="2.4">ELEVENAGENTS</text><text x="444" y="328" font-size="20" font-weight="400" fill="#0C0A09" text-anchor="start">Voice agent, web + in-app</text><text x="444" y="352" font-size="14" font-weight="300" fill="#777169" text-anchor="start">tools and automations</text></g><g class="in" style="animation-delay:0.74s"><rect class="" x="800" y="262" width="360" height="112" rx="20" fill="#F5F3F1" stroke="#E7E5E4" stroke-width="1.5"/><text class="m" x="824" y="296" font-size="12" font-weight="400" fill="#777169" text-anchor="start" letter-spacing="2.4">OPERATIONS</text><text x="824" y="328" font-size="20" font-weight="400" fill="#0C0A09" text-anchor="start">n8n workflows</text><text x="824" y="352" font-size="14" font-weight="300" fill="#777169" text-anchor="start">RevenueCat webhooks · daily digest</text></g><text x="40" y="412" font-size="14" font-weight="300" fill="#777169" text-anchor="start">One person built and runs all of it: app, backend, AI features, voice agent, website, analytics.</text></svg>